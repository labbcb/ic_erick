[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-docker-logreg"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "scikit-learn==1.4.2",
    "pandas",
    "datasets"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
serverapp = "quickstart_docker_logreg.server_app:app"
clientapp = "quickstart_docker_logreg.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 2
fraction-fit = 1
penalty = 'l2'
local-epochs = 1
modelo = 'Regressão Logística'

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
