[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedpca-docker"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow>=2.11.1,<2.18.0",
    "pandas",
    "keras",
    "scikit-learn",
    "imblearn"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]	
publisher = "flower"

[tool.flwr.app.components]
serverapp = "fedpca_docker.server_app:app"
clientapp = "fedpca_docker.client_app:app"

[tool.flwr.app.config]
# Número de rodadas deve levar em consideração as possíveis rodadas de pré-processamento
num-server-rounds = 5
pre_processamento = false
tipo_dados = 'fedpca'
metodo = 'Regressão Logística'
oversample = false
n_variaveis = 23
n_classes = 4
# Parâmetros do Autoencoder
input_size = 60660
encoded_size = 30
ac_epochs = 10
ac_batch_size = 32
# Parâmetros da função de Regressão Logística
penalty = 'l2'
C = 0.5
solver = 'saga'
max_iter = 2
# Parâmetros da função de Rede Neural
epochs = 10
batch_size = 32
verbose = false
[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
