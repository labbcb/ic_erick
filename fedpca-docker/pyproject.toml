[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedpca-docker"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "flwr-datasets[vision]>=0.5.0",
    "tensorflow>=2.11.1,<2.18.0",
    "pandas",
    "keras",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]	
publisher = "flower"

[tool.flwr.app.components]
serverapp = "fedpca_docker.server_app:app"
clientapp = "fedpca_docker.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 1
batch-size = 32
verbose = false

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
